# CIFAR-10 Experiment Configuration
dataset:
  name: cifar10
  data_dir: ./data
  subset_of_training_data: null
  num_workers: 0

model:
  name: cifar_cnn
  num_classes: 10

training:
  epochs: 30
  batch_size: 128
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: sgd
  loss_fn: cross_entropy

craig:
  subset_ratios:
    - 0.10
    - 0.20
    - 0.30
    - 0.50
  distance_metric: euclidean
  gradient_layer: all
  weighted: true
  chunk_size: 64
  allow_large_computation: false
  max_samples_safety: 20000

experiments:
  seeds:
    - 42
    - 123
    - 456

profiles:
  debug:
    epochs: 2
    batch_size: 64
    subset_of_training_data: 500
    seeds: [42]
    craig:
      subset_ratios: [0.10, 0.20]
  standard:
    epochs: 25
    batch_size: 128
    subset_of_training_data: 10000
    seeds: [42, 123, 456]
    craig:
      subset_ratios: [0.10, 0.20, 0.30, 0.50]

device:
  type: auto

logging:
  save_csv: true
  save_plots: true
  results_dir: ./results
