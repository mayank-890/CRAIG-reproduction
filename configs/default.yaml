# Default base configuration
dataset:
  name: mnist
  data_dir: ./data
  subset_of_training_data: null
  num_workers: 0

model:
  name: logistic_regression
  input_dim: 784
  num_classes: 10

training:
  epochs: 20
  batch_size: 128
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: sgd
  loss_fn: cross_entropy

craig:
  subset_ratios:
    - 0.05
    - 0.10
    - 0.20
    - 0.30
    - 0.50
  distance_metric: euclidean
  gradient_layer: all
  weighted: true
  chunk_size: 128
  allow_large_computation: false
  max_samples_safety: 20000

experiments:
  seeds:
    - 42
    - 123
    - 456
    - 789
    - 1000

profiles:
  debug:
    epochs: 2
    batch_size: 64
    subset_of_training_data: 1000
    seeds: [42]
    craig:
      subset_ratios: [0.05, 0.10, 0.20, 0.50]
  standard:
    epochs: 20
    batch_size: 128
    subset_of_training_data: null
    seeds: [42, 123, 456, 789, 1000]
    craig:
      subset_ratios: [0.05, 0.10, 0.20, 0.30, 0.50]
  large:
    epochs: 40
    batch_size: 128
    subset_of_training_data: null
    seeds: [42, 123, 456, 789, 1000]
    craig:
      subset_ratios: [0.05, 0.10, 0.20, 0.30, 0.50]

device:
  type: auto # 'auto', 'mps', 'cuda', or 'cpu'

logging:
  save_csv: true
  save_plots: true
  results_dir: ./results
